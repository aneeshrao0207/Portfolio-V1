<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="skills.css">
    <title>Skillls Section</title>
</head>
<body>
<!-- ==========================================
                SKILLS SECTION
========================================== -->

<section class="skills-section" id="skills">

    <div class="container">

        <div class="skills-heading">

            <span>MY TECH ECOSYSTEM</span>

            <h2>Skills & Technologies</h2>

            <p>
                Technologies, tools and capabilities that I use to build
                modern digital experiences.
            </p>

        </div>

        <div class="skills-grid">

            <div class="skill-card"
                data-title="Frontend Development"
                data-icon="💻"
                data-color="#00C6FF"
                data-skills="HTML5,CSS3,JavaScript,React,Tailwind CSS,Responsive Design,Git,GitHub">

                <div class="skill-icon">💻</div>

                <h3>Frontend Development</h3>

            </div>

            <div class="skill-card"
                data-title="UI / UX Design"
                data-icon="🎨"
                data-color="#8B5CF6"
                data-skills="Figma,Wireframing,Prototype,Auto Layout,Design Systems,User Research">

                <div class="skill-icon">🎨</div>

                <h3>UI / UX Design</h3>

            </div>

            <div class="skill-card"
                data-title="AI Assisted Development"
                data-icon="🤖"
                data-color="#06B6D4"
                data-skills="ChatGPT,Claude,Cursor,Copilot,Prompting,Rapid Prototyping">

                <div class="skill-icon">🤖</div>

                <h3>AI Development</h3>

            </div>

            <div class="skill-card"
                data-title="Development Tools"
                data-icon="🛠️"
                data-color="#F59E0B"
                data-skills="VS Code,Git,GitHub,Vercel,Postman,Canva">

                <div class="skill-icon">🛠️</div>

                <h3>Development Tools</h3>

            </div>

            <div class="skill-card"
                data-title="Professional Skills"
                data-icon="🤝"
                data-color="#22C55E"
                data-skills="Leadership,Communication,Teamwork,Problem Solving,Adaptability,Time Management">

                <div class="skill-icon">🤝</div>

                <h3>Professional Skills</h3>

            </div>

            <div class="skill-card"
                data-title="Languages"
                data-icon="🌍"
                data-color="#EC4899"
                data-skills="English,Kannada,Hindi,Telugu,Tamil,Marathi">

                <div class="skill-icon">🌍</div>

                <h3>Languages</h3>

            </div>

        </div>

    </div>

</section>

<!-- ==========================================
            WHEEL MODAL
========================================== -->

<div class="wheel-overlay">

    <div class="wheel-modal">

        <button class="wheel-close">

            <i class="fa-solid fa-xmark"></i>

        </button>

        <div class="wheel-center">

            <div class="wheel-icon">

                💻

            </div>

            <h2>

                Frontend Development

            </h2>

        </div>

        <div class="wheel-container">

            <!-- Chips generated by JS -->

        </div>

    </div>

</div>
<script src="skills.js"></script>
</body>
</html>
