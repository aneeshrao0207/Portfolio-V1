<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700;800&family=Noto+Sans+Gurmukhi:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Noto+Sans+Hebrew:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="test.css">
    <title>Testing Section</title>
</head>
<body>

<!-- =========================================================
     PORTFOLIO INTRO SCREEN
========================================================= -->

<div class="portfolio-intro" id="greetingScreen">

    <!-- Background -->
    <div class="intro-background">

        <div class="intro-grid"></div>

        <div class="intro-glow intro-glow-1"></div>
        <div class="intro-glow intro-glow-2"></div>

        <div class="intro-noise"></div>

    </div>


    <!-- Top Navigation -->
    <div class="intro-top">

        <div class="intro-logo">

            <span>AR</span>

            <div>
                <strong>ANEESH RAO S V</strong>
                <small>PORTFOLIO</small>
            </div>

        </div>


        <div class="intro-language">

            <span id="introLanguage">EN</span>

        </div>

    </div>


    <!-- Main Content -->
    <div class="intro-center">

        <div class="intro-label">

            <span></span>

            WELCOME

            <span></span>

        </div>


        <!-- IMPORTANT:
             This stays in exactly the same position -->
        <div class="greeting-wrapper">

            <div id="greetingText">
                Hello
            </div>

        </div>


        <div class="intro-name">
            Aneesh Rao S V
        </div>


        <div class="intro-role">

            Frontend Developer

            <b>•</b>

            UI/UX Enthusiast

        </div>


        <div class="intro-location">

            <i class="fa-solid fa-location-dot"></i>

            Bengaluru, India

        </div>

    </div>


    <!-- Bottom -->
    <div class="intro-bottom">

        <div class="intro-progress-container">

            <div class="intro-progress-top">

                <span>
                    ENTERING PORTFOLIO
                </span>

                <strong id="introPercent">
                    0%
                </strong>

            </div>


            <div class="intro-progress">

                <div
                    id="introProgressBar">
                </div>

            </div>

        </div>


        <button
            class="intro-skip"
            id="introSkip">

            SKIP

            <span>

                <i class="fa-solid fa-arrow-right"></i>

            </span>

        </button>

    </div>


    <!-- Corner Details -->

    <div class="intro-corner intro-corner-left">
        01
    </div>

    <div class="intro-corner intro-corner-right">
        PORTFOLIO / 2026
    </div>

</div>

<script src="test.js"></script>
</body>
</html>
